zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: '00000000000000000000000000000001'
    name: Templates/Experiment
  templates:
  - uuid: ''
    template: Template Semantic MikroTik
    name: Template Semantic MikroTik
    groups:
    - name: Templates/Experiment
    items:
    - uuid: ''
      name: Semantic CPU utilization
      type: CALCULATED
      key: system.cpu.util
      delay: 30s
      history: 7d
      value_type: FLOAT
      trends: 90d
      units: '%'
      params: (last(//raw.cpu.core1)+last(//raw.cpu.core2))/2
    - uuid: ''
      name: Semantic memory utilization
      type: CALCULATED
      key: system.memory.util
      delay: 30s
      history: 7d
      value_type: FLOAT
      trends: 90d
      units: '%'
      params: (last(//raw.mem.used)/last(//raw.mem.total))*100
